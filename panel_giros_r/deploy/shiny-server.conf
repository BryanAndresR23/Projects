# ---------------------------------------------------------------------------
# Ejemplo de configuración para Shiny Server (/etc/shiny-server/shiny-server.conf)
#
# Instalación previa:
#   sudo mkdir -p /srv/shiny-server
#   sudo cp -r panel_giros_r /srv/shiny-server/panel_giros
#   sudo chown -R shiny:shiny /srv/shiny-server/panel_giros
#
# La carpeta de datos NO debe vivir dentro de la aplicación: se define aparte
# con GIROS_DIR_DATOS (ver deploy/Renviron.site) y debe pertenecer al usuario
# que ejecuta Shiny.
#   sudo mkdir -p /var/lib/panel_giros/datos
#   sudo chown -R shiny:shiny /var/lib/panel_giros
# ---------------------------------------------------------------------------

run_as shiny;

server {
  listen 3838;

  location /panel_giros {
    app_dir /srv/shiny-server/panel_giros;

    # Un proceso por aplicación: la base SQLite se comparte entre las sesiones.
    app_idle_timeout 1800;

    log_dir /var/log/shiny-server;
    directory_index off;
  }
}

# ---------------------------------------------------------------------------
# Detrás de un proxy con autenticación institucional (recomendado)
# ---------------------------------------------------------------------------
# El panel toma el usuario de session$user y, si no existe, de la cabecera
# X-Forwarded-User. Ejemplo con nginx:
#
#   location /panel_giros/ {
#     proxy_pass http://127.0.0.1:3838/panel_giros/;
#     proxy_http_version 1.1;
#     proxy_set_header Upgrade $http_upgrade;
#     proxy_set_header Connection "upgrade";
#     proxy_set_header Host $host;
#     proxy_set_header X-Forwarded-User $remote_user;   # <- identidad del validador
#     proxy_read_timeout 20d;
#   }
#
# Sin esa cabecera el histórico registra el usuario del servicio (shiny) para
# todas las cargas, y se pierde la trazabilidad de quién cargó qué.
